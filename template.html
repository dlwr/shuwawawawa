<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>シュワワワワ</title>
<meta name="description" content="日本の手話で発信している YouTube チャンネルの新着まとめ">
<meta property="og:title" content="シュワワワワ">
<meta property="og:description" content="日本の手話で発信している YouTube チャンネルの新着まとめ">
<meta property="og:url" content="https://dlwr.github.io/shuwawawawa/">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary">
<style>
:root {{ --bg: #ffffff; --fg: #15171a; --muted: #5d636b; --line: #e3e6ea; --accent: #0a7ea4; --accent-fg: #ffffff; }}
@media (prefers-color-scheme: dark) {{ :root {{ --bg: #111316; --fg: #e8eaed; --muted: #9aa1a9; --line: #2a2e33; --accent: #4cc3e8; --accent-fg: #0b1d24; }} }}
* {{ box-sizing: border-box; }}
[hidden] {{ display: none !important; }}
html:has(dialog[open]) {{ overflow: hidden; }}
body {{ margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.6 system-ui, -apple-system, "Hiragino Sans", sans-serif; }}
main {{ max-width: 1200px; margin: 0 auto; padding: 24px 16px 64px; }}
h1 {{ font-size: 2rem; margin: 0; letter-spacing: .02em; color: var(--accent); }}
.lead {{ color: var(--muted); margin: 4px 0 12px; }}
.bar {{ position: sticky; top: 0; z-index: 1; background: var(--bg); padding: 8px 0 10px; margin-bottom: 20px; border-bottom: 1px solid var(--line); }}
.views {{ display: flex; gap: 20px; margin-bottom: 10px; }}
.views a {{ color: var(--muted); font-weight: 600; text-decoration: none; padding: 2px 0; border-bottom: 2px solid transparent; }}
.new {{ margin-left: 6px; font-size: .75rem; font-weight: 400; color: var(--accent); }}
.views a[aria-current] {{ color: var(--fg); border-color: var(--accent); }}
.filters {{ display: flex; gap: 6px; overflow-x: auto; }}
.filter {{ flex: none; font: inherit; font-size: .9rem; padding: 4px 10px; border: 1px solid var(--line); border-radius: 4px; background: transparent; color: var(--fg); cursor: pointer; }}
.filter[aria-pressed="true"] {{ background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }}
ul {{ list-style: none; padding: 0; margin: 0; }}
.grid {{ display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 24px 16px; }}
[data-view="shorts"] {{ grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }}
body:has(#unwatched[aria-pressed="true"]) .video:has(.watched:checked) {{ display: none; }}
.thumb {{ display: block; width: 100%; aspect-ratio: 16/9; padding: 0; border: 0; margin-bottom: 8px; background: var(--line); cursor: pointer; }}
[data-view="shorts"] .thumb {{ aspect-ratio: 9/16; }}
.thumb img {{ width: 100%; height: 100%; display: block; object-fit: cover; }}
.video:has(.watched:checked) .thumb img {{ opacity: .35; }}
.title {{ display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; overflow: hidden; color: var(--fg); font-weight: 600; line-height: 1.4; text-decoration: none; }}
.title:hover {{ text-decoration: underline; }}
.sub {{ margin: 4px 0 0; font-size: .875rem; color: var(--muted); }}
.sub a {{ color: inherit; }}
.seen {{ display: inline-flex; align-items: center; gap: 4px; margin-top: 4px; font-size: .8rem; color: var(--muted); cursor: pointer; }}
.channels li {{ padding: 10px 0; border-bottom: 1px solid var(--line); }}
.channels a {{ color: var(--fg); font-weight: 600; margin-right: 8px; }}
.channels p {{ margin: 2px 0 0; font-size: .875rem; color: var(--muted); }}
.tag {{ font-size: .75rem; color: var(--muted); border: 1px solid var(--line); border-radius: 3px; padding: 0 5px; margin-right: 4px; }}
dialog {{ width: min(960px, 100vw - 24px, (100vh - 96px) * 16 / 9); max-width: none; max-height: none; padding: 0; border: 0; background: #000; }}
dialog.short {{ width: min(100vw - 24px, (100vh - 96px) * 9 / 16); }}
dialog::backdrop {{ background: rgb(0 0 0 / .75); }}
dialog form {{ text-align: right; }}
dialog button {{ font: inherit; padding: 8px 12px; border: 0; background: none; color: #fff; cursor: pointer; }}
#frame {{ aspect-ratio: 16/9; }}
.short #frame {{ aspect-ratio: 9/16; }}
#frame iframe {{ width: 100%; height: 100%; display: block; border: 0; }}
footer {{ margin-top: 40px; font-size: .8rem; color: var(--muted); }}
</style>
</head>
<body>
<main>
<h1>シュワワワワ</h1>
<p class="lead">日本の手話で発信している YouTube チャンネルの新着まとめ（{count} チャンネル）</p>
<div class="bar">
<nav class="views" aria-label="表示の切替"><a href="#videos">動画{new_videos}</a><a href="#shorts">ショート{new_shorts}</a><a href="#channels">チャンネル</a></nav>
<div class="filters" role="group" aria-label="絞り込み"><button class="filter" id="unwatched" aria-pressed="false">未視聴のみ</button>{buttons}</div>
</div>
<ul data-view="videos" class="grid">{videos}</ul>
<ul data-view="shorts" class="grid" hidden>{shorts}</ul>
<ul data-view="channels" class="channels" hidden>{channels}</ul>
<footer>更新 {updated} JST · 掲載の追加・削除は <a href="https://github.com/dlwr/shuwawawawa">GitHub</a> から</footer>
</main>
<dialog id="player"><form method="dialog"><button>閉じる</button></form><div id="frame"></div></dialog>
<script>
const views = [...document.querySelectorAll("[data-view]")];
const show = () => {{
  const id = views.some(v => v.dataset.view === location.hash.slice(1)) ? location.hash.slice(1) : "videos";
  views.forEach(v => v.hidden = v.dataset.view !== id);
  document.querySelectorAll(".views a").forEach(a => a.hash === "#" + id ? a.setAttribute("aria-current", "page") : a.removeAttribute("aria-current"));
}};
addEventListener("hashchange", () => {{ show(); scrollTo(0, 0); }});
show();

const chosen = new Set();
document.querySelectorAll(".filter").forEach(b => b.addEventListener("click", () => {{
  const on = b.getAttribute("aria-pressed") !== "true";
  b.setAttribute("aria-pressed", on);
  if (b.id) return;
  on ? chosen.add(b.textContent) : chosen.delete(b.textContent);
  document.querySelectorAll("[data-tags]").forEach(li => {{
    const t = li.dataset.tags.split(" ");
    li.hidden = [...chosen].some(c => !t.includes(c));
  }});
}}));

let seen = new Set();
try {{ seen = new Set(JSON.parse(localStorage.getItem("watched"))); }} catch {{}}
document.querySelectorAll(".watched").forEach(c => c.checked = seen.has(c.value));
const mark = c => {{
  c.checked ? seen.add(c.value) : seen.delete(c.value);
  try {{ localStorage.setItem("watched", JSON.stringify([...seen])); }} catch {{}}
}};
document.addEventListener("change", e => e.target.matches(".watched") && mark(e.target));

const dialog = document.getElementById("player"), frame = document.getElementById("frame");
let api;
const loadApi = () => api ??= new Promise(ready => {{
  window.onYouTubeIframeAPIReady = ready;
  document.head.append(Object.assign(document.createElement("script"), {{ src: "https://www.youtube.com/iframe_api" }}));
}});
document.addEventListener("click", e => {{
  const b = e.target.closest(".thumb");
  if (!b) return;
  const box = b.parentElement.querySelector(".watched");
  const iframe = Object.assign(document.createElement("iframe"), {{
    src: `https://www.youtube-nocookie.com/embed/${{encodeURIComponent(b.dataset.id)}}?autoplay=1&enablejsapi=1&origin=${{encodeURIComponent(location.origin)}}`,
    allow: "autoplay; encrypted-media; picture-in-picture",
    allowFullscreen: true,
    title: b.getAttribute("aria-label"),
  }});
  dialog.classList.toggle("short", !!b.closest('[data-view="shorts"]'));
  frame.replaceChildren(iframe);
  dialog.showModal();
  loadApi().then(() => iframe.isConnected && new YT.Player(iframe, {{
    events: {{ onStateChange: s => {{ if (s.data === YT.PlayerState.ENDED) {{ box.checked = true; mark(box); }} }} }},
  }}));
}});
dialog.addEventListener("click", e => e.target === dialog && dialog.close());
dialog.addEventListener("close", () => frame.replaceChildren());
</script>
</body>
</html>
