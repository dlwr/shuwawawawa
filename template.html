<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>シュワワワワ</title>
<meta name="description" content="日本の手話で発信している YouTube チャンネルの新着まとめ">
<meta property="og:title" content="シュワワワワ">
<meta property="og:description" content="日本の手話で発信している YouTube チャンネルの新着まとめ">
<meta property="og:url" content="https://dlwr.github.io/shuwawawawa/">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary">
<style>
:root {{ --bg: #ffffff; --fg: #15171a; --muted: #5d636b; --line: #e3e6ea; --accent: #0a7ea4; --accent-fg: #ffffff; }}
@media (prefers-color-scheme: dark) {{ :root {{ --bg: #111316; --fg: #e8eaed; --muted: #9aa1a9; --line: #2a2e33; --accent: #4cc3e8; --accent-fg: #0b1d24; }} }}
* {{ box-sizing: border-box; }}
body {{ margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.6 system-ui, -apple-system, "Hiragino Sans", sans-serif; }}
main {{ max-width: 880px; margin: 0 auto; padding: 24px 16px 64px; }}
h1 {{ font-size: 2rem; margin: 0; letter-spacing: .02em; color: var(--accent); }}
h2 {{ font-size: 1.15rem; margin: 48px 0 12px; border-bottom: 1px solid var(--line); padding-bottom: 6px; }}
.lead {{ color: var(--muted); margin: 4px 0 20px; }}
.filters {{ display: flex; flex-wrap: wrap; gap: 6px; }}
.filter {{ font: inherit; font-size: .9rem; padding: 4px 10px; border: 1px solid var(--line); border-radius: 4px; background: transparent; color: var(--fg); cursor: pointer; }}
.filter[aria-pressed="true"] {{ background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }}
ul {{ list-style: none; padding: 0; margin: 0; }}
.video {{ display: flex; gap: 14px; padding: 12px 0; border-bottom: 1px solid var(--line); }}
.video[hidden] {{ display: none; }}
.thumb {{ flex: 0 0 200px; aspect-ratio: 16/9; padding: 0; border: 0; background: var(--line); cursor: pointer; }}
.thumb img {{ width: 100%; height: 100%; display: block; object-fit: cover; }}
.video.playing {{ flex-direction: column; }}
.video.playing .thumb {{ flex-basis: auto; width: 100%; }}
.title {{ color: var(--fg); font-weight: 600; text-decoration: none; }}
.title:hover {{ text-decoration: underline; }}
.sub {{ margin: 4px 0 0; font-size: .875rem; color: var(--muted); }}
.sub a {{ color: inherit; }}
.channels li {{ padding: 10px 0; border-bottom: 1px solid var(--line); }}
.channels a {{ color: var(--fg); font-weight: 600; margin-right: 8px; }}
.channels p {{ margin: 2px 0 0; font-size: .875rem; color: var(--muted); }}
.tag {{ font-size: .75rem; color: var(--muted); border: 1px solid var(--line); border-radius: 3px; padding: 0 5px; margin-right: 4px; }}
footer {{ margin-top: 40px; font-size: .8rem; color: var(--muted); }}
@media (max-width: 560px) {{ .video {{ flex-direction: column; }} .thumb {{ flex-basis: auto; width: 100%; }} }}
</style>
</head>
<body>
<main>
<h1>シュワワワワ</h1>
<p class="lead">日本の手話で発信している YouTube チャンネルの新着まとめ（{count} チャンネル）</p>
<div class="filters" role="group" aria-label="絞り込み">{buttons}</div>
<h2>新着</h2>
<ul id="videos">{rows}</ul>
<h2>チャンネル</h2>
<ul class="channels">{channels}</ul>
<footer>更新 {updated} JST · 掲載の追加・削除は <a href="https://github.com/dlwr/shuwawawawa">GitHub</a> から</footer>
</main>
<script>
const active = new Set();
document.querySelectorAll(".filter").forEach(b => b.addEventListener("click", () => {{
  const on = b.getAttribute("aria-pressed") !== "true";
  b.setAttribute("aria-pressed", on);
  on ? active.add(b.textContent) : active.delete(b.textContent);
  document.querySelectorAll(".video").forEach(li => {{
    const t = li.dataset.tags.split(" ");
    li.hidden = [...active].some(a => !t.includes(a));
  }});
}}));
document.getElementById("videos").addEventListener("click", e => {{
  const b = e.target.closest("button.thumb");
  if (!b) return;
  const li = b.closest(".video");
  b.outerHTML = `<iframe class="thumb" src="https://www.youtube-nocookie.com/embed/${{b.dataset.id}}?autoplay=1" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen title="動画"></iframe>`;
  li.classList.add("playing");
  li.querySelector("iframe").focus();
}});
</script>
</body>
</html>
